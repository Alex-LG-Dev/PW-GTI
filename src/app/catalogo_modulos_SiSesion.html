<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>GTI | Soluciones móviles para empresa</title>
</head>
<meta charset="UTF-8">
  <title>Nuestro Catálogo</title>
</head>
<body>
  <header class="header">
    <div class="container">
      <!-- Aqui va el logo-->
      <div class="logo">
        <a href="index.html"><img src="images/logoGTI.png" alt="Logo de GTI"></a>
      </div>

      <!-- Aqui va el menu con botones de navegacion-->
      <button class="menu-toggle" aria-label="Abrir menú">&#9776;</button>
      <nav class="nav-links">
        <a href="nosotros.html">Sobre Nosotros</a>
        <a href="contacto.html">Contacto</a>
      </nav>

      <!-- Aqui va el menu con botones de inicio de sesion y registro-->
      <div class="user-info">
        <a href="index.html">Cerrar Sesión</a>
        <span class="username">Juan Pérez</span>
        <img src="images/user.png" alt="Usuario" class="avatar">
      </div>
  
    </div>
  </header>
  <section>
    <h1>Nuestro catálogo</h1>

    <div style="overflow-x: auto; white-space: nowrap;">
      <!-- Item 1: Tareas -->
      <div style="display: inline-block; vertical-align: top;">
        <img src="tareas.png" alt="Módulo de Tareas" style="width: 300px; height: auto;">
        <div>
          <h2>Tareas</h2>
          <p>
            Crea, edita y publica tareas como profesor y permite que tus alumnos puedan realizar sus tareas desde casa.
          </p>
        </div>
      </div>
      <!-- Item 2: Calendario -->
      <div style="display: inline-block; vertical-align: top;">
        <img src="calendario.png" alt="Módulo de Calendario" style="width: 300px; height: auto;">
        <div>
          <h2>Calendario</h2>
          <p>
            Con este módulo tus alumnos podrán organizarse mediante un calendario en su página de usuarios.
          </p>
        </div>
      </div>

      <!-- Puedes duplicar y adaptar más bloques como este si tienes más módulos -->
    </div>
  </section>
</body>
</html>
