<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Profesor PROA</title>
    <meta name="description" content="Página de Inicio Profesor PROA">
    <link rel="stylesheet" href="/src/app/css/estilos_Proa2.css">

<body>

            <img src="../img/imagen3-homepage.png" alt="imagen3" id="imagen-3">
        </section>

        <!-- Últimas asignaturas visitadas -->
        <section id="asignaturas">
            <header class="texto-2">Últimas asignaturas visitadas</header>
            <ul class="tarjetas-asignaturas">
                <li>
                    <article>
                        <header class="titulo-asignatura">
                            <h1 class="texto-3"></h1>
                            <img src="../img/icono-asignatura.jpg" alt="icono-asignatura">

                <li>

                    </article>
                </li>
                <li>
                    <article>
                        <header class="titulo-asignatura">
                            <h1 class="texto-3"></h1>
                            <img src="../img/icono-asignatura.jpg" alt="icono-asignatura">
                        </header>
                        <p class="nombre-profesor texto-3"></p>
                        <p class="tareas-pendientes texto-3"></p>
                    </article>
                </li>
            </ul>
        </section>

        <!-- Últimas tareas guardadas -->
        <section id="tareas">
            <header class="texto-2">Últimas tareas guardadas</header>
            <ul class="tarjetas-tareas">
                <li>
                    <article>
                        <header class="titulo-tarea">
                            <h1 class="texto-3"></h1>
                            <img src="../img/icono-tarea.jpg" alt="icono-tarea">
                        </header>
                        <p class="nombre-asignatura texto-3"></p>
                        <p class="fecha-entrega texto-3">
