<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calendario Escolar</title>
  <link rel="stylesheet" href="css/estilos_souphiane.css" />
  <link rel="stylesheet" href="../app/css/estilos_combinados.css" />
</head>
<body>
  <header class="encabezado">
    <!-- Logo -->
    <div class="contenedor-logo">
        <img src="../img/Logo-Proa.png" class="logotipo" alt="PROA">
    </div>

    <!-- Menú desplegable de asignaturas -->
    <nav class="navegacion">
        <details class="desplegable">
            <summary class="boton-desplegable">ASIGNATURAS</summary>

            <div class="panel-asignaturas">
                <h3>Asignaturas Matriculadas 24/25</h3>
                <details class="curso">
                    <summary class="titulo-curso">1º</summary>
                    <a href="Asignatura_Seleccionada_Tareas_Matematicas_Profesor.html">Matemáticas</a>
                    <a href="Asignatura_Seleccionada_Tareas_Fisica_Profesor.html">Física 1</a>
                    <a href="Asignatura_Seleccionada_Tareas_Programacion_Profesor.html">Programación 1</a>
                </details>
                <details class="curso">
                    <summary class="titulo-curso">2º</summary>
                    
                </details>
            </div>
        </details>
    </nav>

    <!-- Usuario -->
    <div class="contenedor-usuario">
        <span class="nombre-usuario" id="nombre-cabecera">Nombre&nbsp;Usuario</span>
        <img src="../img/usuario.png"          alt="Avatar"         class="icono">
        <img src="../img/cerrarsesionGTI.png"  alt="Cerrar sesión"  class="icono icono-cerrar-sesion">
    </div>
</header>
    <!-- ============================  MIGAS DE PAN  ============================= -->
    <nav class="migas-de-pan">
      <p><a href="home-page-professor.html">Inicio</a> &gt; <a href="Asignatura_Seleccionada_Tareas_Matematicas_Profesor.html">Matematicas</a> &gt; Tareas</p>
  <!-- ===== CONTENEDOR PRINCIPAL ===== -->
  <div class="calendario-container">

      <!-- ----------  Panel de próximos eventos  ---------- -->
      <aside class="panel-eventos">
          <h3 class="titulo-eventos">Próximos eventos</h3>

        <a href="../app/Asignatura_Seleccionada_Tareas_Matematicas_Profesor.html">

          <div class="tarjeta-evento">
              <span class="fecha-evento">25 may</span>
              <div class="info-evento">
                  <p class="nombre-evento">Tarea 1. Conjuntos y vectores</p>
                  <p class="asignatura-evento">Asignatura: Matemáticas</p>
              </div>
              <img src="../img/icono-tarea.jpg" class="icono-evento" alt="">
          </div>
        </a>
      <a href="../app/Asignatura_Seleccionada_Tareas_Matematicas_Profesor.html">
          <div class="tarjeta-evento">
              <span class="fecha-evento">27 may</span>
              <div class="info-evento">
                  <p class="nombre-evento">Tarea 2. Álgebra</p>
                  <p class="asignatura-evento">Asignatura: Matemáticas</p>
              </div>
              <img src="../img/icono-tarea.jpg" class="icono-evento" alt="">
          </div>
        </a>
      </aside>

      <div class="calendar">
          <div class="calendar-header">
              <button id="prevMonth">&#10094;</button>
              <h2 id="monthYear"></h2>
              <button id="nextMonth">&#10095;</button>
          </div>

          <div class="calendar-grid">
              <div class="day-name">Lun</div><div class="day-name">Mar</div>
              <div class="day-name">Mie</div><div class="day-name">Jue</div>
              <div class="day-name">Vie</div><div class="day-name">Sab</div>
              <div class="day-name">Dom</div>
              <div id="calendarDays" class="calendar-days"></div>
          </div>
      </div>

  </div>

  <script src="../js/calendario.js"></script>
</body>

</html>
