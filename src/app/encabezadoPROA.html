<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encabezado PROA</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- cambia la ruta si guardas el CSS en otra carpeta -->
  <link rel="stylesheet" href="./css/estilos_proa3.css">
</head>
<body>

  <!-- ===== Encabezado ===== -->
  <header class="encabezado">
    <!-- Logo -->
    <div class="contenedor-logo">
      <img src="../img/Logo-Proa.png" alt="Logo de PROA" class="logotipo">
    </div>

    <!-- Menú desplegable de asignaturas -->
    <nav class="navegacion">
      <details class="desplegable">
        <summary class="boton-desplegable">ASIGNATURAS</summary>

        <div class="panel-asignaturas">
          <!-- Curso 1º -->
          <details class="curso">
            <summary class="titulo-curso">1º</summary>
            <a href="#">Matemáticas</a>
            <a href="#">Física</a>
            <a href="#">Química</a>
          </details>

          <!-- Curso 2º -->
          <details class="curso">
            <summary class="titulo-curso">2º</summary>
            <a href="#">Lengua</a>
            <a href="#">Historia</a>
          </details>

          <!-- Curso 3º -->
          <details class="curso">
            <summary class="titulo-curso">3º</summary>
            <a href="#">Inglés</a>
            <a href="#">Biología</a>
          </details>

          <!-- Curso 4º -->
          <details class="curso">
            <summary class="titulo-curso">4º</summary>
            <a href="#">Economía</a>
            <a href="#">Filosofía</a>
          </details>
        </div>
      </details>
    </nav>

    <!-- Info usuario -->
    <div class="contenedor-usuario">
      <a class="username">Juan Pérez</a>
      <img src="../img/usuario.png" alt="Avatar de usuario" class="icono">
      <img src="../img/cerrarsesionGTI.png" alt="Cerrar sesión" class="icono icono-cerrar-sesion">
    </div>
  </header>

</body>
</html>
