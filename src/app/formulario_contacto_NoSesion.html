<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulario de contacto">
    <title>GTI Contacto</title>
</head>
<body>
    <header class="header">
        <div class="container">
          <!-- Aqui va el logo-->
          <div class="logo">
            <a href="index.html"><img src="images/logoGTI.png" alt="Logo de GTI"></a>
          </div>
    
          <!-- Aqui va el menu con botones de navegacion-->
          <button class="menu-toggle" aria-label="Abrir menú">&#9776;</button>
          <nav class="nav-links">
            <a href="nosotros.html">Sobre Nosotros</a>
            <a href="contacto.html">Contacto</a>
          </nav>
    
          <!-- Aqui va el menu con botones de inicio de sesion y registro-->
          <div class="auth-buttons">
            <a href="login.html" class="login">Iniciar Sesión</a>
            <a href="registro.html" class="register">Registrarse</a>
          </div>
        </div>
      </header>
    <!--Aqui va el formulario-->
    <main>
        <section id="Formulario">
            <!--Titulo formulario-->
            <h1 id="titulo-formulario">Formulario</h1>
            <!--Aqui van los campos del formulario-->
            <form action="#" method="post">
                <fieldset>
                    <!--texto descriptivo del formulario que mejora la accesiblidad y que despues se ocultara con css-->
                    <legend>Datos de contacto</legend>
                    <!--Campo de nombre-->
                    <label for="nombre-apellido">Nombre y Apellidos</label>
                    <input id="nombre-apellido" type="text" placeholder="Escribe aqui tu nombre" name="nombre" autocomplete="name" required aria-describedby="nombre-ayuda">
                    <!--texto de error al completar el campo de nombre que despues se ocultara con css-->
                    <small id="nombre-ayuda">
                        Introduce tu nombre tal y como aparece en tu documento de identidad.
                    </small>
                    <!--Campo de correo-->
                    <label for="correo">Correo institucional</label>
                    <input id="correo" type="email" placeholder="Ej: correo@institucional" name="correo" autocomplete="email" required aria-describedby="correo-ayuda">
                    <!--texto de error al completar el campo de correo que despues se ocultara con css-->
                    <small id="correo-ayuda">
                        Introduce correctamente tu correo institucional
                    </small>
                    <!--Campo de mensaje del formulario-->
                    <label for="motivo">Motivo</label>
                    <textarea id="motivo" placeholder="Escribe aqui tu duda" name="mensaje" required aria-describedby="motivo-ayuda"></textarea>
                     <!--texto de error al completar el campo de motivo que despues se ocultara con css-->
                     <small id="motivo-ayuda">
                        Vuelve a escribir tu mensaje
                    </small>
                    <!--campo desplegable del producto que quiere pedir-->
                    <label for="productos">Producto</label>
                    <select name="productos" id="productos" required> 
                        <option value="">Elija un Producto</option>
                        <option value="producto-1">producto 1</option>
                        <option value="producto-2">producto 2</option>
                        <option value="producto-3">producto 3</option>
                        <option value="producto-4">producto 4</option>
                        <option value="producto-5">producto 5</option>
                    </select>
                    <!--boton que permite enviar el formulario-->
                    <button type="submit" id="envio-formulario">Enviar</button>
                </fieldset>
            </form>
        </section>
    </main>
</body>
</html>
