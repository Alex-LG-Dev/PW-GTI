<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>PROA | poner titulo</title>

<body>

  <nav class="migas_de_pan">
    <p>Inicio > Matematicas</p>
  </nav>

    <h1 class="titulo_Asignatura">Matemáticas</h1>
    <div class="botones">
      <button class="boton">Tareas</button>
      <button class="boton">Calendario</button>
    </div>

  <div class="contenedor_imagen">
      <img src="imagen-ilustrativa.png" alt="Estudiante con libro abierto">
  </div>
    
    <section class="listado_tareas_proximas">
      <h2 class="titulo_tareas_proximas">Tareas próximas a entregar</h2>

      <ul class="lista_tareas_proximas">
          <li class="tarea">
            <p class="fecha_entrega_tarea">Fecha entrega: 6/04/2025 &nbsp; 23:55</p>
            <p class="asigntura_tarea">Asignatura: Matemáticas</p>
            <p class="tarea_titulo">Tarea 1. Conjuntos y vectores</p>
            <button class="boton_tarea">Ver más</button>
          </li>
      </ul>

      
    </section>

    <section class="listado_tareas_calificadas">
      <h2 class="titulo_tareas_calificadas">Tareas calificadas</h2>

      <ul class="lista_tareas_calificadas">
          <li class="tarea">
            <p class="fecha_entrega_tarea">Fecha entrega: 6/04/2025 &nbsp; 23:55</p>
            <p class="asigntura_tarea">Asignatura: Matemáticas</p>
            <p class="tarea_titulo">Tarea 1. Conjuntos y vectores</p>
            <button class="boton_tarea">Ver más</button>
          </li>
      </ul>
      
    </section>

</body>
</html>
