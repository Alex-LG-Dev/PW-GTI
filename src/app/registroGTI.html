<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE-edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REGISTRO GTI</title>
  <link rel="stylesheet" href="css/estiloGTI.css">
  
  <style>
    .warnings {
      width: 200px;
      text-align: center;
      margin: auto;
      color: #B06Ab3;
      padding-top: 20px;
    }
  </style>
</head>
<body class="body-login">
<!--Esto es el panel de la izquierda-->
<div class="panel-izquierdo">
  <a href="../index.html">
    <img src="../img/logoGTI.png" alt="Logo de GTI">
  </a>
  <p>Conectamos docentes y alumnos con los mejores módulos educativos</p>
</div>
  <!--Esto es el panel de la derecha-->
  <div class="panel-derecho">
    <div class="cuadrado-login">
      <h2>SIGN<span class="in">UP</span></h2>
      <form id="form">
        <!--aqui va el input de Nombre de usuario-->
        <label for="nombreUsuario">Nombre Usuario</label>
        <input type="text" id="nombreUsuario" placeholder="Ingresa Nombre">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Ingresa Email">
        <label for="contraseña">Contraseña</label>
        <input type="password" id="contraseña" placeholder="Ingresa Contraseña">
        <button type="submit" class="botonGTI">Registrarse</button>
        <p class="warnings" id="warnings"></p>
      </form>
    </div>
  </div>
  <script src="../js/registro.js"></script>
</body>
</html>
