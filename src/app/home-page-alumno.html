<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pagina de Inicio Alumno PROA">
    <title>Panel Alumno PROA</title>
</head>
<body>
    <main>
        <section id="encabezado-contenido">
            <!--Titulo pagina-->
            <h1 class="titulo1">BIENVENIDO A PROA</h1>
            <!--Subtitulo pagina-->
            <h3 class="texto1">Tu espacio de estudio digital</h3>
        </section>
        <!--imagenes home page-->
        <section id="imagenes-home-page">
            <img src="" alt="imagen1" id="imagen-1">
            <img src="" alt="imagen2" id="imagen-2">
            <img src="" alt="imagen3" id="imagen-3">
        </section>
        <!--Tarjetas Asignaturas-->
        <section id="asignaturas">
            <header class="texto-2">Ultimas asignaturas visitadas</header>
            <ul class="tarjetas-asginaturas">
                <li>
                    <!--Tarjeta 1-->
                    <article aria-label="asignatura 1">
                        <!--encabezado tarjeta-->
                        <header class="titulo-asignatura">
                            <!--Titulo asignatura-->
                            <h1 class="texto-3"></h1>
                            <img src="" alt="icono-asignatura">
                        </header>
                        <!--Contenido tarjeta-->
                        <p id="nombre-profesor" class="texto-3"></p>
                        <p id="tareas-pendientes" class="texto-3"></p>
                    </article>
                </li>
                <li>
                    <!--Tarjeta 2-->
                    <article aria-label="asignatura 2">
                        <!--encabezado tarjeta-->
                        <header class="titulo-asignatura">
                            <!--Titulo asignatura-->
                            <h1 class="texto-3"></h1>
                            <img src="" alt="icono-asignatura">
                        </header>
                        <!--Contenido tarjeta-->
                        <p id="nombre-profesor" class="texto-3"></p>
                        <p id="tareas-pendientes" class="texto-3"></p>
                    </article>
                </li>
                <li>
                    <!--Tarjeta 3-->
                    <article aria-label="asignatura 3">
                        <!--encabezado tarjeta-->
                        <header class="titulo-asignatura">
                            <!--Titulo asignatura-->
                            <h1 class="texto-3"></h1>
                            <img src="" alt="icono-asignatura">
                        </header>
                        <!--Contenido tarjeta-->
                        <p id="nombre-profesor" class="texto-3"></p>
                        <p id="tareas-pendientes" class="texto-3"></p>
                    </article>
                </li>
            </ul>
        </section>
        <section id="tareas">
            <!--Titulo seccion-->
            <header class="texto-2">Tareas proximas a entregar</header>
            <!--Tarjetas tareas-->
            <ul class="tarjetas-tareas">
                <li>
                    <!--Tarjeta 1-->
                    <article aria-label="tarea1">
                        <!--encabezado tarjeta-->
                        <header class="titulo-tarea">
                            <!--Titulo tarea-->
                            <h1 class="texto-3"></h1>
                            <img src="" alt="icono-tarea">
                        </header>
                        <!--Contenido tarjeta-->
                        <p id="nombre-asignatura" class="texto-3"></p>
                        <p id="fecha-entrega" class="texto-3"><time datetime="datetime"></time></p>
                    </article>
                </li>
                <li>
                    <!--Tarjeta 2-->
                    <article aria-label="tarea2">
                        <!--encabezado tarjeta-->
                        <header class="titulo-tarea">
                            <!--Titulo tarea-->
                            <h1 class="texto-3"></h1>
                            <img src="" alt="icono-tarea">
                        </header>
                        <!--Contenido tarjeta-->
                        <p id="nombre-asignatura" class="texto-3"></p>
                        <p id="fecha-entrega" class="texto-3"><time datetime="datetime"></time></p>
                    </article>
                </li>
                <li>
                    <!--Tarjeta 3-->
                    <article aria-label="tarea3">
                        <!--encabezado tarjeta-->
                        <header class="titulo-tarea">
                            <!--Titulo tarea-->
                            <h1 class="texto-3"></h1>
                            <img src="" alt="icono-tarea">
                        </header>
                        <!--Contenido tarjeta-->
                        <p id="nombre-asignatura" class="texto-3"></p>
                        <p id="fecha-entrega" class="texto-3"><time datetime="datetime"></time></p>
                    </article>
                </li>
            </ul>
        </section>
    </main>
</body>
</html>
