<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calendario Escolar</title>
  <link rel="stylesheet" href="css/estilos_souphiane.css" />
  <link rel="stylesheet" href="../app/css/estilos_combinados.css" />
</head>
<body>
  <header class="encabezado">
    <!-- Logo -->
    <div class="contenedor-logo">
        <a href="home-page-alumno.html"><img src="../img/Logo-Proa.png" alt="Logo de PROA" class="logotipo"></a>
    </div>

    <!-- Menú desplegable de asignaturas -->
    <nav class="navegacion">
      <details class="desplegable">
        <summary class="boton-desplegable">ASIGNATURAS</summary>

        <div class="panel-asignaturas">
          <!-- Curso 1º -->
          <details class="curso">
            <summary class="titulo-curso">1º</summary>
            <a href="Asignatura_Seleccionada_Matematicas_Alumno.html">Matemáticas</a>
            <a href="Asignatura_Seleccionada_Fisica_Alumno.html">Física</a>
            <a href="Asignatura_Seleccionada_Programación_Alumno.html">Programación 1</a>
          </details>
        </div>
      </details>
    </nav>

    <!-- Info usuario -->
    <div class="contenedor-usuario">
      <span class="nombre-usuario">Nombre&nbsp;Usuario</span>
      <img src="../img/user.png" alt="Avatar de usuario" class="icono">
      <a href="loginPROA.html"><img src="../img/cerrarsesionGTI.png" alt="Cerrar sesión" class="icono icono-cerrar-sesion"></a>
    </div>
  </header>
  <!-- ===== CONTENEDOR PRINCIPAL ===== -->
  <div class="calendario-container">

      <!-- ----------  Panel de próximos eventos  ---------- -->
      <aside class="panel-eventos">
          <h3 class="titulo-eventos">Próximos eventos</h3>

        <a href="../app/Asignatura_Seleccionada_Matematicas_Alumno.html">

          <div class="tarjeta-evento">
              <span class="fecha-evento">25 may</span>
              <div class="info-evento">
                  <p class="nombre-evento">Tarea 1. Conjuntos y vectores</p>
                  <p class="asignatura-evento">Asignatura: Matemáticas</p>
              </div>
              <img src="../img/icono-tarea.jpg" class="icono-evento" alt="">
          </div>
        </a>
      <a href="../app/Asignatura_Seleccionada_Matematicas_Alumno.html">
          <div class="tarjeta-evento">
              <span class="fecha-evento">27 may</span>
              <div class="info-evento">
                  <p class="nombre-evento">Tarea 2. Álgebra</p>
                  <p class="asignatura-evento">Asignatura: Matemáticas</p>
              </div>
              <img src="../img/icono-tarea.jpg" class="icono-evento" alt="">
          </div>
        </a>
      </aside>

      <div class="calendar">
          <div class="calendar-header">
              <button id="prevMonth">&#10094;</button>
              <h2 id="monthYear"></h2>
              <button id="nextMonth">&#10095;</button>
          </div>

          <div class="calendar-grid">
              <div class="day-name">Mon</div><div class="day-name">Tue</div>
              <div class="day-name">Wed</div><div class="day-name">Thu</div>
              <div class="day-name">Fri</div><div class="day-name">Sat</div>
              <div class="day-name">Sun</div>

              <div id="calendarDays" class="calendar-days"></div>
          </div>
      </div>

  </div>

  <script src="../js/calendario.js"></script>
</body>

</html>
