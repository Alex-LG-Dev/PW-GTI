<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../js/code.js">
    <title>GTI | Los mejores modulos educativos</title>
</head>
<body>
  <header class="header">
    <div class="container">
      <!-- Aqui va el logo-->
      <div class="logo">
        <a href="index.html"><img src="images/logoGTI.png" alt="Logo de GTI"></a>
      </div>

      <!-- Aqui va el menu con botones de navegacion-->
      <button class="menu-toggle" aria-label="Abrir menú">&#9776;</button>
      <nav class="nav-links">
        <a href="nosotros.html">Sobre Nosotros</a>
        <a href="contacto.html">Contacto</a>
      </nav>

      <!-- Aqui va el menu con botones de inicio de sesion y registro-->
      <div class="auth-buttons">
        <a href="login.html" class="login">Iniciar Sesión</a>
        <a href="registro.html" class="register">Registrarse</a>
      </div>
    </div>
  </header>
  <section class="bannerGTI">
    <h1>Módulos Educativos GTI</h1>
    <p>Diseñados para impulsar la educación en tu institución</p>
    <a href="catalogo.html" class="boton_catalogo">Ver módulos</a>
  </section>

  <section class="registroGTI">
    <h2>Prueba nuestra demo PROA</h2>
    <p>Verifícate con tu correo institucional para tener acceso a una prueba de nuestros módulos</p>

    <div class="contenedor_registroGTI">
      <form>
        <label for="correo">Correo institucional</label>
        <input type="email" id="correo" name="correo" required>

        <label for="usuario">Nombre de usuario</label>
        <input type="text" id="usuario" name="usuario" required>

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required>

        <button type="submit">Registrarse</button>
      </form>
    </div>
  </section>

</body>
</html>
