<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/src/app/css/estiloGTI.css">
    <title>GTI | Los mejores modulos educativos</title>
</head>
<body>
  <!-- Aqui va el encabezado-->
  <header>
      <!-- Aqui va el logo-->
      <div class="logo">
        <a href="index.html"><img src="img/logoGTI.png" alt="Logo de GTI"></a>
      </div>
      <div class="div-header">
      <!-- Aqui va el menu con botones de navegacion-->
      <nav class="botones-sub">
        <a href="app/sobrenosotros.html">Sobre Nosotros</a>
        <a href="app/formulario_contacto_NoSesion.html">Contacto</a>
      </nav>


      <!-- Aqui va el menu con botones de inicio de sesion y registro-->
      <div class="botones-sesion">
        <a href="app/loginGTI.html" class="botonGTI">Iniciar Sesión</a>
        <a href="app/registroGTI.html" class="register">Registrarse</a>
      </div>
    </div>
  </header>
  <!-- Termina el header-->

  <!-- Aqui va el banner-->
  <section class="bannerGTI">
    <h1>Módulos Educativos GTI</h1>
    <p>Diseñados para impulsar la educación en tu institución</p>
    <a href="app/catalogo_modulos_NoSesion.html" class="botonGTI">Ver módulos</a>
  </section>
  <!-- Aqui termina el banner-->

  <!-- Aqui va la seccion con dos bloques-->
  <section class="registroGTI">
    <!-- Aqui va el bloque con info-->
    <div class="texto-demo">
      <h2>Prueba nuestra demo PROA</h2>
      <p>Verifícate con tu correo institucional para tener acceso a una prueba de nuestros módulos</p>
    </div>
    <!-- Aqui va el registro de GTI-->
    <div class="contenedor-registroGTI">
      <form class="formGTI">
        <label for="correo">Correo institucional</label>
        <input type="email" id="correo" name="correo" required>

        <label for="usuario">Nombre de usuario</label>
        <input type="text" id="usuario" name="usuario" required>

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required>

        <button type="submit">Registrarse</button>
        <p class="warnings" id="warnings"></p>
      </form>
    </div>
  </section>

</body>
</html>
